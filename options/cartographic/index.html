<!doctype html>
<html lang="en" data-look="cartographic">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light">
  <title>Decennial Energy Maps</title>
  <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@200..800&display=swap">
  <link rel="stylesheet" href="../shared/core.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#coverage">Skip to coverage</a>

  <header class="masthead">
    <a class="brand" href="#top" aria-label="Decennial Energy Maps, top of page">
      <span class="brand-mark" data-copy="wordmark"></span>
      <span class="brand-product" data-copy="product"></span>
    </a>
    <nav class="masthead-nav" aria-label="Sections">
      <a href="#coverage" data-copy="nav.coverage"></a>
      <a href="#scales" id="nav-scales" data-copy="nav.scales"></a>
    </nav>
  </header>

  <main class="sheet" id="top">
    <div class="lead">
      <section class="hero" aria-labelledby="hero-title">
        <h1 class="hero-title" id="hero-title" data-copy="headline"></h1>
        <div class="hero-aside">
          <p class="hero-sub" data-copy="subhead"></p>
          <div class="hero-find" id="find"></div>
          <div class="hero-legend" id="hero-legend"></div>
        </div>
      </section>

      <figure class="plate plate-hero" id="plate-hero">
        <div class="plate-field" id="hero-field">
          <div class="plate-map" id="hero-map"></div>
        </div>
        <figcaption class="plate-collar">
          <span class="collar-scale" id="hero-scale" aria-hidden="true"></span>
          <span class="collar-asof" data-copy="coverage.asOf"></span>
        </figcaption>
      </figure>

      <!-- story: the power path; replaces the large and small loads section in ?v=story -->
      <section class="dem-story" id="story" data-dem-only="story" aria-labelledby="story-title">
        <div class="dem-story-stage">
          <div class="story-text">
            <h2 class="story-heading" id="story-title" data-copy="scales.heading"></h2>
            <p class="story-intro" data-copy="scales.intro"></p>
            <div id="story-steps"></div>
          </div>
          <div class="story-frame" aria-hidden="true">
            <div class="story-progress"></div>
          </div>
        </div>
      </section>

      <section class="scales" id="scales" data-dem-hide="story" aria-labelledby="scales-title">
        <h2 class="scales-heading" id="scales-title" data-copy="scales.heading"></h2>
        <p class="scales-intro" data-copy="scales.intro"></p>
        <div class="scales-toggle" id="scale-toggle" data-dem-only="zoom"></div>
        <div class="scales-blocks">
          <div class="scale-block scale-large">
            <h3 class="scale-title" data-copy="scales.large.title"></h3>
            <p class="scale-text" data-copy="scales.large.text"></p>
            <p class="scale-key"><span class="sym sym-transmission" aria-hidden="true"></span><span data-copy="scales.large.label"></span></p>
          </div>
          <div class="scale-block scale-small">
            <h3 class="scale-title" data-copy="scales.small.title"></h3>
            <p class="scale-text" data-copy="scales.small.text"></p>
            <p class="scale-key"><span class="sym sym-distribution" aria-hidden="true"></span><span data-copy="scales.small.label"></span></p>
          </div>
        </div>
        <p class="scales-note" data-copy="scales.note"></p>
      </section>
    </div>

    <section class="coverage" id="coverage" aria-labelledby="coverage-title">
      <div class="coverage-head">
        <h2 class="coverage-heading" id="coverage-title" data-copy="coverage.heading"></h2>
        <p class="coverage-intro" data-copy="coverage.intro"></p>
      </div>

      <div class="coverage-body">
        <figure class="plate plate-index" id="plate-index">
          <div class="plate-tabs" id="filter" data-dem-only="micro"></div>
          <div class="plate-field" id="index-field">
            <div class="plate-map" id="map"></div>
          </div>
          <figcaption class="plate-collar plate-collar-index">
            <div class="index-legend" id="legend"></div>
            <p class="collar-asof" data-copy="coverage.asOf"></p>
          </figcaption>
        </figure>

        <div class="gazetteer">
          <h3 class="gazetteer-heading" data-copy="coverage.listHeading"></h3>
          <div id="list"></div>
        </div>
      </div>

      <div class="index">
        <h3 class="index-heading" data-copy="coverage.directoryHeading"></h3>
        <div id="directory"></div>
      </div>
    </section>
  </main>

  <footer class="colophon">
    <p class="colophon-brand"><span class="brand-mark" data-copy="wordmark"></span> <span class="brand-product" data-copy="product"></span></p>
    <p class="colophon-note"><span data-copy="footer.internal"></span> <span class="colophon-year" data-copy="footer.year"></span></p>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
  <script src="../shared/us-states-albers.js"></script>
  <script src="../shared/apps.js"></script>
  <script src="../shared/copy.js"></script>
  <script src="../shared/core.js"></script>
  <script src="world.js"></script>
</body>
</html>
