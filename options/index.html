<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Decennial Energy Maps - design options</title>
  <link rel="icon" href="shared/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300..700&display=swap">
  <style>
    /* Review board: tool chrome for comparing options, not one of the designs. */
    :root { --ink: #312439; --aub: #43314d; --gold: #EBBE07; --lilac: #efe8f4; --wash: #f7f5f9; --rule: #e2dce6; --muted: #5f4f67; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 400 16px/1.5 "Work Sans", system-ui, sans-serif; color: var(--ink); background: var(--wash); }
    ::selection { background: var(--gold); color: var(--ink); }
    a { color: inherit; text-underline-offset: 3px; }
    a:focus-visible { outline: 2px solid var(--aub); outline-offset: 3px; }
    header { padding: 48px max(16px, 5vw) 28px; background: var(--ink); color: #fff; }
    .mark { font-weight: 700; letter-spacing: .14em; }
    h1 { margin: 18px 0 10px; font-size: clamp(2rem, 4vw, 3.2rem); line-height: 1.05; font-weight: 600; letter-spacing: -.02em; }
    header p { margin: 0; max-width: 70ch; color: #e6dded; }
    header strong { color: var(--gold); font-weight: 600; }
    main { padding: 12px max(16px, 5vw) 64px; }
    .look { padding: 36px 0; border-bottom: 1px solid var(--rule); }
    .look-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; margin-bottom: 18px; }
    .look h2 { margin: 0; font-size: 1.6rem; font-weight: 600; letter-spacing: -.01em; }
    .look-head p { margin: 0; max-width: 72ch; color: var(--muted); }
    .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
    @media (max-width: 1100px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
    figure { margin: 0; }
    .thumb { display: block; aspect-ratio: 16 / 10; overflow: hidden; background: #fff; border: 1px solid var(--rule); }
    .thumb img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; transition: transform .5s cubic-bezier(.16, 1, .3, 1); }
    .thumb:hover img { transform: scale(1.02); }
    .thumb.missing { display: grid; place-items: center; color: var(--muted); font-size: .9rem; }
    figcaption { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; padding: 10px 2px 0; font-size: .92rem; }
    figcaption b { font-weight: 600; }
    figcaption span { display: flex; gap: 12px; color: var(--muted); }
    .note { max-width: 72ch; color: var(--muted); font-size: .92rem; }
  </style>
</head>
<body>
  <header>
    <div class="mark">DECENNIAL</div>
    <h1>Design options</h1>
    <p>Five looks, each built with all four motion concepts. Click a thumbnail to open that look in that motion; every page carries a switcher at the bottom left to jump between looks and motions. <strong>Same content and data everywhere</strong>, so compare the visuals and how they move.</p>
  </header>
  <main id="board"></main>
  <script>
    var LOOKS = [
      { id: 'control-room', name: 'Control room', text: 'The page as a grid operator’s mimic board: states as annunciator lamps on an equal hex board, gold bus lines energized.' },
      { id: 'schematic', name: 'Single-line schematic', text: 'The page as an electrical one-line diagram: a main bus runs down the page, sections hang off it through breakers, gold marks the energized path.' },
      { id: 'night-lights', name: 'Night lights field', text: 'The country as satellite night imagery in dots: covered states glow, gold trails carry power along the corridors.' },
      { id: 'cartographic', name: 'Cartographic editorial', text: 'A national atlas plate: survey-map hatching, overprinted gold corridors, large confident type.' },
      { id: 'isometric', name: 'Isometric campus', text: 'Isometric drawings of a substation feeding a data hall, above a tilted hex board of the states.' }
    ];
    var MOTIONS = [
      { id: 'story', name: 'Story', text: 'Scroll the power path' },
      { id: 'energize', name: 'Energize', text: 'Pulses light the map' },
      { id: 'zoom', name: 'Zoom', text: 'Transmission vs distribution' },
      { id: 'micro', name: 'Micro', text: 'Filter buttons morph' }
    ];
    var board = document.getElementById('board');
    LOOKS.forEach(function (L) {
      var sec = document.createElement('section');
      sec.className = 'look';
      sec.innerHTML = '<div class="look-head"><h2></h2><p></p></div><div class="grid"></div>';
      sec.querySelector('h2').textContent = L.name;
      sec.querySelector('.look-head p').textContent = L.text;
      var grid = sec.querySelector('.grid');
      MOTIONS.forEach(function (M) {
        var href = L.id + '/index.html?v=' + M.id;
        /* Each thumbnail shows the motion's signature moment, not the shared first screen. */
        var SIGNATURE = { story: 'story-frame2-1440', energize: 'energize-done-1440', zoom: 'zoom-distribution-1440', micro: 'micro-siting-1440' };
        var shot = 'shots/' + L.id + '/' + SIGNATURE[M.id] + '.jpg';
        var fig = document.createElement('figure');
        fig.innerHTML = '<a class="thumb" href="' + href + '"><img alt="" loading="lazy"></a>' +
          '<figcaption><b></b><span><a href="shots/' + L.id + '/' + M.id + '-1440.jpg">First screen</a><a href="shots/' + L.id + '/' + (M.id === 'story' ? 'story-reduced' : M.id) + '-1440-full.jpg">Full page</a><a href="shots/' + L.id + '/' + M.id + '-390.jpg">Phone</a></span></figcaption>';
        var img = fig.querySelector('img');
        img.src = shot;
        img.alt = L.name + ', ' + M.name + ' motion, mid-motion frame at 1440 pixels wide';
        img.onerror = function () { var a = img.parentNode; a.classList.add('missing'); a.textContent = 'Open the live page'; };
        fig.querySelector('b').textContent = M.name + ': ' + M.text;
        grid.appendChild(fig);
      });
      board.appendChild(sec);
    });
    var note = document.createElement('p');
    note.className = 'note';
    note.textContent = 'Screenshots live in options/shots/<look>/ at 1440, 1366 and 390 pixels wide, plus full-page captures and mid-scroll story frames. App links stay hidden on the public repo; with a local apps.local.js beside options/shared/core.js, every map opens to its sign-in page.';
    board.appendChild(note);
  </script>
</body>
</html>
