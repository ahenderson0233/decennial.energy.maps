<!doctype html>
<html lang="en" data-look="reference">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Decennial Energy Maps - core reference</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300..700&display=swap">
  <link rel="stylesheet" href="core.css">
  <style>
    /* Wiring reference only: no design. Every direction replaces this. */
    body { margin: 0; font-family: var(--dem-font); color: var(--dem-ink); background: #fff; }
    section, header, footer { padding: 32px 24px; max-width: 1200px; margin: 0 auto; }
    .story-stage-inner { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; height: 100%; align-items: center; }
    .dem-story-step { display: none; } .dem-story-step.is-active { display: block; }
    .dem-story.is-static .dem-story-step { display: block; }
    .scales { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .dem-directory { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .dem-entry { padding: 12px; border: 1px solid #ddd; }
    .dem-entry.is-related { border-color: var(--dem-gold); }
  </style>
</head>
<body>
  <header>
    <strong data-copy="wordmark"></strong> <span data-copy="product"></span>
  </header>

  <section class="hero">
    <h1 data-copy="headline"></h1>
    <p data-copy="subhead"></p>
    <div id="find"></div>
  </section>

  <!-- story: the power path, only in ?v=story; doubles as the large and small loads section -->
  <section class="dem-story" id="story" data-dem-only="story">
    <div class="dem-story-stage">
      <div class="story-stage-inner">
        <div id="story-steps"></div>
        <div id="story-art"><p>Direction draws the power path here; progress: <output id="story-p">0</output></p></div>
      </div>
    </div>
  </section>

  <section id="scales" data-dem-hide="story">
    <h2 data-copy="scales.heading"></h2>
    <p data-copy="scales.intro"></p>
    <div id="scale-toggle" data-dem-only="zoom"></div>
    <div class="scales">
      <div><h3 data-copy="scales.large.title"></h3><p data-copy="scales.large.text"></p></div>
      <div><h3 data-copy="scales.small.title"></h3><p data-copy="scales.small.text"></p></div>
    </div>
    <p data-copy="scales.note"></p>
  </section>

  <section id="coverage">
    <h2 data-copy="coverage.heading"></h2>
    <p data-copy="coverage.intro"></p>
    <div id="filter" data-dem-only="micro"></div>
    <div id="legend"></div>
    <div id="map"></div>
    <p data-copy="coverage.asOf"></p>
    <h3 data-copy="coverage.listHeading"></h3>
    <div id="list"></div>
    <h3 data-copy="coverage.directoryHeading"></h3>
    <div id="directory"></div>
  </section>

  <footer>
    <strong data-copy="wordmark"></strong> <span data-copy="product"></span>
    <p><span data-copy="footer.internal"></span> <span data-copy="footer.year"></span></p>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
  <script src="us-states-albers.js"></script>
  <script src="apps.js"></script>
  <script src="copy.js"></script>
  <script src="core.js"></script>
  <script>
    DEM.ready(function (DEM) {
      DEM.renderFind(document.getElementById('find'));
      DEM.renderLegend(document.getElementById('legend'));
      var form = new URLSearchParams(location.search).get('form') || 'geo';
      var map = DEM.renderMap(document.getElementById('map'), { form: form });
      DEM.renderList(document.getElementById('list'));
      DEM.renderDirectory(document.getElementById('directory'));

      if (DEM.motion === 'energize') map.energize();
      if (DEM.motion === 'micro') DEM.renderFilter(document.getElementById('filter'));
      if (DEM.motion === 'zoom') {
        DEM.renderScaleToggle(document.getElementById('scale-toggle'));
        DEM.on('scale:change', function (s) { map.zoomTo(s === 'small' ? ['NY', 'MA', 'CT', 'RI', 'NJ', 'PA', 'MD', 'DE', 'VA', 'OH'] : null, 900); });
      }
      if (DEM.motion === 'story') {
        DEM.renderStorySteps(document.getElementById('story-steps'));
        DEM.scrollStory(document.getElementById('story'), function (s) {
          document.getElementById('story-p').value = s.p.toFixed(2) + ' step ' + s.step;
        });
      }
    });
  </script>
</body>
</html>
