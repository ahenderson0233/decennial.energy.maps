<!doctype html>
<html lang="en" data-look="night-lights">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#1b1420">
  <title>Decennial Energy Maps</title>
  <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300..700&display=swap">
  <link rel="stylesheet" href="../shared/core.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="nl-skip" href="#coverage">Skip to coverage</a>

  <header class="nl-header">
    <a class="nl-brand" href="#top" aria-label="Decennial Energy Maps, top of page">
      <span class="nl-wordmark" data-copy="wordmark"></span>
      <span class="nl-product" data-copy="product"></span>
    </a>
    <nav class="nl-nav" aria-label="Sections">
      <a href="#coverage" data-copy="nav.coverage"></a>
      <a href="#scales" id="nl-nav-scales" data-copy="nav.scales"></a>
    </nav>
  </header>

  <main id="top">
    <section class="nl-hero" aria-labelledby="nl-headline">
      <div class="nl-hero-field">
        <div class="nl-hero-copy">
          <div class="nl-hero-north">
            <h1 class="nl-headline" id="nl-headline" data-copy="headline"></h1>
          </div>
          <div class="nl-hero-south">
            <p class="nl-subhead" data-copy="subhead"></p>
            <div class="nl-find" id="nl-find"></div>
          </div>
        </div>
        <div class="nl-hero-map" id="nl-hero-map"></div>
      </div>
    </section>

    <!-- story: the power path; replaces the scales section in ?v=story -->
    <section class="dem-story nl-story" id="story" data-dem-only="story" aria-labelledby="nl-story-heading">
      <div class="dem-story-stage">
        <div class="nl-story-inner">
          <div class="nl-story-copy">
            <h2 class="nl-h2" id="nl-story-heading" data-copy="scales.heading"></h2>
            <div class="nl-rail" aria-hidden="true"></div>
            <div id="nl-story-steps"></div>
          </div>
          <div class="nl-story-art" id="nl-story-art" aria-hidden="true"></div>
        </div>
      </div>
    </section>

    <section class="nl-section nl-scales" id="scales" data-dem-hide="story" aria-labelledby="nl-scales-heading">
      <div class="nl-scales-copy">
        <h2 class="nl-h2" id="nl-scales-heading" data-copy="scales.heading"></h2>
        <p class="nl-lead" data-copy="scales.intro"></p>
        <div class="nl-scale-toggle" id="nl-scale-toggle" data-dem-only="zoom"></div>
        <div class="nl-scale-blocks">
          <article class="nl-scale-block nl-scale-large" aria-labelledby="nl-large-title">
            <svg class="nl-diagram nl-diagram-large" viewBox="0 0 320 96" aria-hidden="true" focusable="false"></svg>
            <h3 class="nl-h3" id="nl-large-title" data-copy="scales.large.title"></h3>
            <p class="nl-scale-label" data-copy="scales.large.label"></p>
            <p class="nl-body" data-copy="scales.large.text"></p>
          </article>
          <article class="nl-scale-block nl-scale-small" aria-labelledby="nl-small-title">
            <svg class="nl-diagram nl-diagram-small" viewBox="0 0 320 96" aria-hidden="true" focusable="false"></svg>
            <h3 class="nl-h3" id="nl-small-title" data-copy="scales.small.title"></h3>
            <p class="nl-scale-label" data-copy="scales.small.label"></p>
            <p class="nl-body" data-copy="scales.small.text"></p>
          </article>
        </div>
        <p class="nl-note" data-copy="scales.note"></p>
      </div>
      <div class="nl-scales-map" id="nl-scales-map" data-dem-only="zoom"></div>
    </section>

    <section class="nl-section nl-coverage" id="coverage" aria-labelledby="nl-coverage-heading">
      <div class="nl-coverage-head">
        <h2 class="nl-h2" id="nl-coverage-heading" data-copy="coverage.heading"></h2>
        <p class="nl-lead" data-copy="coverage.intro"></p>
        <div class="nl-filter" id="nl-filter" data-dem-only="micro"></div>
      </div>
      <div class="nl-coverage-body">
        <div class="nl-coverage-map" id="nl-coverage-map"></div>
        <aside class="nl-coverage-key" aria-label="Map key">
          <div id="nl-legend"></div>
          <p class="nl-asof" data-copy="coverage.asOf"></p>
        </aside>
      </div>
      <div class="nl-states">
        <h3 class="nl-h3 nl-subheading" data-copy="coverage.listHeading"></h3>
        <div id="nl-list"></div>
      </div>
      <div class="nl-dir">
        <h3 class="nl-h3 nl-subheading" data-copy="coverage.directoryHeading"></h3>
        <div id="nl-directory"></div>
      </div>
    </section>
  </main>

  <footer class="nl-footer">
    <p class="nl-footer-brand"><span class="nl-wordmark" data-copy="wordmark"></span> <span class="nl-product" data-copy="product"></span></p>
    <p class="nl-footer-meta"><span data-copy="footer.internal"></span> <span class="nl-year" data-copy="footer.year"></span></p>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
  <script src="../shared/us-states-albers.js"></script>
  <script src="../shared/apps.js"></script>
  <script src="../shared/copy.js"></script>
  <script src="../shared/core.js"></script>
  <script src="world.js"></script>
</body>
</html>
