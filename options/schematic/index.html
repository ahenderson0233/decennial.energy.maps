<!doctype html>
<html lang="en" data-look="schematic">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Decennial Energy Maps</title>
  <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300..700&display=swap">
  <link rel="stylesheet" href="../shared/core.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <script>
    /* Hold the drawing de-energized before first paint when the energize motion will run. */
    (function () {
      var v = new URLSearchParams(location.search).get('v');
      if (['story', 'zoom', 'micro'].indexOf(v) === -1 && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.documentElement.classList.add('ez-armed');
      }
    })();
  </script>
  <a class="skip" href="#coverage">Skip to the coverage map</a>

  <div class="sheet" id="sheet">
    <!-- the drawing's own wires: main bus, hero feeder, map feeder (drawn by world.js) -->
    <svg class="wires" id="wires" aria-hidden="true" focusable="false"></svg>

    <header class="masthead">
      <span class="source" id="source" aria-hidden="true"></span>
      <a class="brand" href="#top">
        <span class="wordmark" data-copy="wordmark"></span>
        <span class="product" data-copy="product"></span>
      </a>
      <nav class="nav" aria-label="Sections">
        <a href="#coverage" data-copy="nav.coverage"></a>
        <a href="#scales" id="nav-scales" data-copy="nav.scales"></a>
      </nav>
    </header>

    <main>
      <section class="hero" id="top" aria-labelledby="headline">
        <div class="hero-copy">
          <h1 class="headline" id="headline" data-copy="headline"></h1>
          <p class="lede hero-lede" data-copy="subhead"></p>
          <div class="find" id="find"></div>
        </div>
        <figure class="keyplan" id="keyplan">
          <div class="keyplan-frame">
            <div class="keyplan-map" id="keyplan-map"></div>
          </div>
          <figcaption class="keyplan-key">
            <ul class="mini-key">
              <li><span class="mini-sw mini-sw-siting" aria-hidden="true"></span><span data-copy="legend.siting.label"></span></li>
              <li><span class="mini-sw mini-sw-hosting" aria-hidden="true"></span><span data-copy="legend.hosting.label"></span></li>
              <li><span class="mini-sw mini-sw-partial" aria-hidden="true"></span><span data-copy="legend.partial.label"></span></li>
            </ul>
          </figcaption>
        </figure>
      </section>

      <!-- story: the power path, drawn as the one-line assembles; replaces the scales section in this motion -->
      <section class="dem-story" id="story" data-dem-only="story" aria-labelledby="story-heading">
        <div class="dem-story-stage">
          <div class="story-grid">
            <div class="story-text">
              <div class="feeder-head">
                <span class="tap" aria-hidden="true"></span>
                <h2 class="feeder-label" id="story-heading" data-copy="scales.heading"></h2>
              </div>
              <p class="story-intro" data-copy="scales.intro"></p>
              <div class="story-steps" id="story-steps"></div>
            </div>
            <div class="story-art" id="story-art"></div>
          </div>
        </div>
      </section>

      <section class="scales" id="scales" data-dem-hide="story" aria-labelledby="scales-heading">
        <div class="feeder-head">
          <span class="tap" aria-hidden="true"></span>
          <h2 class="feeder-label" id="scales-heading" data-copy="scales.heading"></h2>
        </div>
        <p class="lede" data-copy="scales.intro"></p>
        <div class="switch-slot" id="scale-toggle" data-dem-only="zoom"></div>
        <div class="loads">
          <span class="tap tap-loads" aria-hidden="true"></span>
          <div class="load load-large">
            <span class="tap tap-load" aria-hidden="true"></span>
            <span class="drop" aria-hidden="true"></span>
            <h3 class="load-title" data-copy="scales.large.title"></h3>
            <p class="load-text" data-copy="scales.large.text"></p>
            <p class="load-end"><span class="arrow" aria-hidden="true"></span><span class="annot" data-copy="scales.large.label"></span></p>
          </div>
          <div class="load load-small">
            <span class="tap tap-load" aria-hidden="true"></span>
            <span class="drop" aria-hidden="true"></span>
            <h3 class="load-title" data-copy="scales.small.title"></h3>
            <p class="load-text" data-copy="scales.small.text"></p>
            <p class="load-end"><span class="arrow" aria-hidden="true"></span><span class="annot" data-copy="scales.small.label"></span></p>
          </div>
        </div>
        <p class="note" data-copy="scales.note"></p>
      </section>

      <section class="coverage" id="coverage" aria-labelledby="coverage-heading">
        <div class="feeder-head">
          <span class="tap" aria-hidden="true"></span>
          <h2 class="feeder-label" id="coverage-heading" data-copy="coverage.heading"></h2>
        </div>
        <p class="lede" data-copy="coverage.intro"></p>
        <div class="cov-controls">
          <div class="legend" id="legend"></div>
          <div class="switch-slot" id="filter" data-dem-only="micro"></div>
          <div class="switch-slot" id="scale-toggle-map" data-dem-only="zoom"></div>
        </div>
        <div class="mapframe" id="mapframe">
          <div class="map-host" id="map"></div>
        </div>
        <p class="asof" data-copy="coverage.asOf"></p>

        <h3 class="sub-label" data-copy="coverage.listHeading"></h3>
        <div class="statelist" id="list"></div>

        <h3 class="sub-label" data-copy="coverage.directoryHeading"></h3>
        <div class="switchboard">
          <span class="tap tap-board" aria-hidden="true"></span>
          <div id="directory"></div>
        </div>
      </section>
    </main>

    <footer class="titleblock">
      <span class="ground" id="ground" aria-hidden="true"></span>
      <div class="tb">
        <p class="tb-mark"><span class="wordmark" data-copy="wordmark"></span> <span class="product" data-copy="product"></span></p>
        <p class="tb-internal" data-copy="footer.internal"></p>
        <p class="tb-year" data-copy="footer.year"></p>
      </div>
    </footer>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
  <script src="../shared/us-states-albers.js"></script>
  <script src="../shared/apps.js"></script>
  <script src="../shared/copy.js"></script>
  <script src="../shared/core.js"></script>
  <script src="world.js"></script>
</body>
</html>
