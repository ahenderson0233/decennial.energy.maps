<!doctype html>
<html lang="en" data-look="control-room">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#312439">
  <title>Decennial Energy Maps</title>
  <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300..700&display=swap">
  <link rel="stylesheet" href="../shared/core.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="cr-skip" href="#coverage">Skip to coverage</a>

  <header class="cr-rail cr-head">
    <div class="cr-wrap cr-head-inner">
      <a class="cr-brand" href="#top" aria-label="Decennial Energy Maps, top of page">
        <span class="cr-wordmark" data-copy="wordmark"></span>
        <span class="cr-product" data-copy="product"></span>
      </a>
      <nav class="cr-nav" aria-label="Sections">
        <a href="#coverage" data-copy="nav.coverage"></a>
        <a href="#scales" class="cr-nav-scales" data-copy="nav.scales"></a>
      </nav>
    </div>
  </header>

  <main id="top">
    <section class="cr-hero" aria-labelledby="hero-title">
      <div class="cr-wrap cr-hero-grid">
        <h1 class="cr-headline" id="hero-title" data-copy="headline"></h1>
        <p class="cr-lead" data-copy="subhead"></p>
        <div class="cr-find" id="find"></div>
      </div>

      <div class="cr-wrap">
        <div class="cr-annunciator">
          <div class="cr-annunciator-rail">
            <h2 class="cr-engr cr-annunciator-title" id="annunciator-title" data-copy="coverage.listHeading"></h2>
          </div>
          <ul class="cr-windows" id="windows" aria-labelledby="annunciator-title"></ul>
        </div>
      </div>
    </section>

    <!-- story: the power path, only in ?v=story; it replaces the scales section -->
    <section class="dem-story cr-story" id="story" data-dem-only="story" aria-labelledby="story-title">
      <h2 class="dem-sr" id="story-title" data-copy="scales.heading"></h2>
      <div class="dem-story-stage cr-stage">
        <div class="cr-wrap cr-stage-grid">
          <div class="cr-stage-steps" id="story-steps"></div>
          <div class="cr-stage-art" id="story-art" aria-hidden="true">
            <div class="cr-stage-face">
              <svg class="cr-mimic" id="mimic" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid meet" focusable="false">
                <defs>
                  <pattern id="cr-fence" patternUnits="userSpaceOnUse" width="8" height="8">
                    <path d="M0 8L8 0" class="cr-fence-line"/>
                  </pattern>
                </defs>

                <!-- painted (de-energized) lines: the whole path is always on the board -->
                <g class="cr-paint">
                  <path d="M144 150H186"/>
                  <path d="M254 150H760"/>
                  <path d="M760 150H862V208"/>
                  <path d="M862 268V300M770 300H950"/>
                  <path d="M800 300V460H300"/>
                </g>

                <!-- equipment, drawn in engraved lines; each group brightens when its segment is live -->
                <g class="cr-eq" data-seg="0">
                  <circle cx="110" cy="150" r="34"/>
                  <path d="M88 150c7-14 15-14 22 0s15 14 22 0" class="cr-eq-fine"/>
                  <circle cx="206" cy="150" r="20"/>
                  <circle cx="234" cy="150" r="20"/>
                  <path d="M110 184V214M86 214H134M94 222H126M102 230H118" class="cr-eq-fine"/>
                </g>
                <g class="cr-eq" data-seg="1">
                  <path d="M390 150L366 268M390 150L414 268M372 238H408M378 208H402M383 178H397M360 160H420M372 238L402 208M408 238L378 208" class="cr-eq-fine"/>
                  <path d="M520 150L496 268M520 150L544 268M502 238H538M508 208H532M513 178H527M490 160H550M502 238L532 208M538 238L508 208" class="cr-eq-fine"/>
                  <path d="M650 150L626 268M650 150L674 268M632 238H668M638 208H662M643 178H657M620 160H680M632 238L662 208M668 238L638 208" class="cr-eq-fine"/>
                  <path d="M330 268H710" class="cr-eq-ground"/>
                </g>
                <g class="cr-eq" data-seg="2">
                  <rect x="736" y="112" width="232" height="232" rx="4" class="cr-fence"/>
                  <rect x="800" y="138" width="24" height="24" class="cr-eq-solid"/>
                  <circle cx="862" cy="226" r="18"/>
                  <circle cx="862" cy="250" r="18"/>
                </g>
                <g class="cr-eq" data-seg="3">
                  <rect x="788" y="370" width="24" height="24" class="cr-eq-solid"/>
                  <path d="M680 460V520M664 446H696M560 460V520M544 446H576M440 460V520M424 446H456" class="cr-eq-fine"/>
                  <path d="M380 540H720" class="cr-eq-ground"/>
                </g>
                <g class="cr-eq cr-hall" data-seg="4">
                  <rect x="70" y="392" width="230" height="148" rx="3"/>
                  <path d="M70 420H300" class="cr-eq-fine"/>
                  <g class="cr-racks">
                    <rect x="92" y="436" width="34" height="88" rx="2"/>
                    <rect x="138" y="436" width="34" height="88" rx="2"/>
                    <rect x="184" y="436" width="34" height="88" rx="2"/>
                    <rect x="230" y="436" width="34" height="88" rx="2"/>
                  </g>
                  <g class="cr-rack-lamps">
                    <circle cx="109" cy="450" r="4"/><circle cx="109" cy="466" r="4"/><circle cx="109" cy="482" r="4"/><circle cx="109" cy="498" r="4"/>
                    <circle cx="155" cy="450" r="4"/><circle cx="155" cy="466" r="4"/><circle cx="155" cy="482" r="4"/><circle cx="155" cy="498" r="4"/>
                    <circle cx="201" cy="450" r="4"/><circle cx="201" cy="466" r="4"/><circle cx="201" cy="482" r="4"/><circle cx="201" cy="498" r="4"/>
                    <circle cx="247" cy="450" r="4"/><circle cx="247" cy="466" r="4"/><circle cx="247" cy="482" r="4"/><circle cx="247" cy="498" r="4"/>
                  </g>
                </g>

                <!-- live overlay: gold current, drawn by scroll -->
                <g class="cr-live">
                  <path data-seg="0" pathLength="1" d="M144 150H186"/>
                  <path data-seg="1" pathLength="1" d="M254 150H760"/>
                  <path data-seg="2" pathLength="1" d="M760 150H862V208M862 268V300M862 300H950M862 300H770"/>
                  <path data-seg="3" pathLength="1" d="M800 300V460H300"/>
                </g>

                <!-- station lamps, one per step -->
                <g class="cr-station-lamps">
                  <g data-seg="0"><circle cx="110" cy="92" r="11" class="cr-lamp-bezel"/><circle cx="110" cy="92" r="7" class="cr-lamp-lens"/></g>
                  <g data-seg="1"><circle cx="520" cy="112" r="11" class="cr-lamp-bezel"/><circle cx="520" cy="112" r="7" class="cr-lamp-lens"/></g>
                  <g data-seg="2"><circle cx="936" cy="140" r="11" class="cr-lamp-bezel"/><circle cx="936" cy="140" r="7" class="cr-lamp-lens"/></g>
                  <g data-seg="3"><circle cx="560" cy="410" r="11" class="cr-lamp-bezel"/><circle cx="560" cy="410" r="7" class="cr-lamp-lens"/></g>
                  <g data-seg="4"><circle cx="185" cy="368" r="11" class="cr-lamp-bezel"/><circle cx="185" cy="368" r="7" class="cr-lamp-lens"/></g>
                </g>

                <!-- engraved tags -->
                <g class="cr-tags">
                  <text x="110" y="270" text-anchor="middle" data-copy="story.0.title"></text>
                  <text x="520" y="300" text-anchor="middle" data-copy="story.1.title"></text>
                  <text x="852" y="376" text-anchor="middle" data-copy="story.2.title"></text>
                  <text x="560" y="572" text-anchor="middle" data-copy="story.3.title"></text>
                  <text x="185" y="572" text-anchor="middle" data-copy="story.4.title"></text>
                </g>
              </svg>
              <div class="cr-stage-board" id="story-board"></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="cr-scales" id="scales" data-dem-hide="story" aria-labelledby="scales-title">
      <div class="cr-wrap">
        <div class="cr-section-head">
          <h2 class="cr-h2" id="scales-title" data-copy="scales.heading"></h2>
          <p class="cr-intro" data-copy="scales.intro"></p>
        </div>

        <div class="cr-scales-body">
          <div class="cr-switch-panel" id="scale-toggle" data-dem-only="zoom"></div>

          <div class="cr-scale-panels">
            <article class="cr-scale-panel" data-scale-block="large">
              <div class="cr-glyph-face">
                <svg class="cr-glyph" viewBox="0 0 320 120" aria-hidden="true" focusable="false">
                <path class="cr-glyph-paint" d="M8 40H232V64M232 96V104"/>
                <path class="cr-glyph-live" pathLength="1" d="M8 40H232V64"/>
                <path class="cr-glyph-eq" d="M64 40L52 100M64 40L76 100M56 80H72M46 46H82M140 40L128 100M140 40L152 100M132 80H148M122 46H158"/>
                <circle class="cr-glyph-eq" cx="232" cy="74" r="10"/><circle class="cr-glyph-eq" cx="232" cy="88" r="10"/>
                <rect class="cr-glyph-hall" x="250" y="62" width="62" height="50" rx="2"/>
                <path class="cr-glyph-eq" d="M232 98V106H250M260 74H302M260 86H302M260 98H302"/>
                <circle class="cr-glyph-lamp" cx="296" cy="40" r="7"/>
              </svg>
                <p class="cr-engr cr-nameplate" data-copy="scales.large.label"></p>
              </div>
              <h3 class="cr-h3" data-copy="scales.large.title"></h3>
              <p class="cr-body" data-copy="scales.large.text"></p>
            </article>
            <article class="cr-scale-panel" data-scale-block="small">
              <div class="cr-glyph-face">
              <svg class="cr-glyph" viewBox="0 0 320 120" aria-hidden="true" focusable="false">
                <path class="cr-glyph-paint" d="M8 40H214V82H252"/>
                <path class="cr-glyph-live" pathLength="1" d="M8 40H214V82H252"/>
                <path class="cr-glyph-eq" d="M70 40V100M58 32H82M140 40V100M128 32H152M208 34H220V46H208Z"/>
                <rect class="cr-glyph-hall" x="252" y="66" width="44" height="38" rx="2"/>
                <path class="cr-glyph-eq" d="M262 78H286M262 90H286"/>
                <circle class="cr-glyph-lamp" cx="296" cy="40" r="7"/>
              </svg>
                <p class="cr-engr cr-nameplate" data-copy="scales.small.label"></p>
              </div>
              <h3 class="cr-h3" data-copy="scales.small.title"></h3>
              <p class="cr-body" data-copy="scales.small.text"></p>
            </article>
          </div>

          <div class="cr-scale-board" id="scale-board" data-dem-only="zoom" aria-hidden="true"></div>
        </div>

        <p class="cr-note" data-copy="scales.note"></p>
      </div>
    </section>

    <section class="cr-coverage" id="coverage" aria-labelledby="coverage-title">
      <div class="cr-wrap">
        <div class="cr-section-head">
          <h2 class="cr-h2" id="coverage-title" data-copy="coverage.heading"></h2>
          <p class="cr-intro" data-copy="coverage.intro"></p>
        </div>

        <div class="cr-board">
          <div class="cr-board-face" id="map"></div>
          <aside class="cr-console" aria-label="Map key">
            <div class="cr-filter" id="filter" data-dem-only="micro"></div>
            <div class="cr-legend" id="legend"></div>
            <div class="cr-readout" id="readout">
              <span class="cr-readout-window"><span class="cr-readout-lit" id="readout-lit"></span><span class="cr-readout-of"> of <span id="readout-total"></span></span></span>
              <span class="cr-engr cr-readout-label">lamps lit</span>
            </div>
          </aside>
        </div>
        <p class="cr-engr cr-asof" data-copy="coverage.asOf"></p>

        <h3 class="cr-h3 cr-sub" data-copy="coverage.listHeading"></h3>
        <div class="cr-list" id="list"></div>

        <h3 class="cr-h3 cr-sub" data-copy="coverage.directoryHeading"></h3>
        <div class="cr-schedule" id="directory"></div>
      </div>
    </section>
  </main>

  <footer class="cr-rail cr-foot">
    <div class="cr-wrap cr-foot-inner">
      <p class="cr-brand cr-brand-foot">
        <span class="cr-wordmark" data-copy="wordmark"></span>
        <span class="cr-product" data-copy="product"></span>
      </p>
      <p class="cr-foot-meta"><span data-copy="footer.internal"></span> <span class="tnum" data-copy="footer.year"></span></p>
    </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
  <script src="../shared/us-states-albers.js"></script>
  <script src="../shared/apps.js"></script>
  <script src="../shared/copy.js"></script>
  <script src="../shared/core.js"></script>
  <script src="world.js"></script>
</body>
</html>
