<!doctype html>
<html lang="en" data-look="isometric">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Decennial Energy Maps</title>
  <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300..700&display=swap">
  <link rel="stylesheet" href="../shared/core.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#coverage">Skip to coverage</a>

  <header class="masthead">
    <a class="brand" href="#top" aria-label="Decennial Energy Maps, top of page">
      <span class="brand-mark" data-copy="wordmark"></span>
      <span class="brand-product" data-copy="product"></span>
    </a>
    <nav class="masthead-nav" aria-label="Sections">
      <a href="#coverage" data-copy="nav.coverage"></a>
      <a href="#scales" id="nav-scales" data-copy="nav.scales"></a>
    </nav>
  </header>

  <main id="top">
    <!-- Hero: a drawing sheet. Copy in the title block, campus plate and the board as the drawing. -->
    <section class="sheet hero" aria-labelledby="hero-title">
      <div class="sheet-frame" aria-hidden="true"><span class="tick t" style="--i:1"></span><span class="tick b" style="--i:1"></span><span class="tick t" style="--i:2"></span><span class="tick b" style="--i:2"></span><span class="tick t" style="--i:3"></span><span class="tick b" style="--i:3"></span><span class="tick t" style="--i:4"></span><span class="tick b" style="--i:4"></span><span class="tick t" style="--i:5"></span><span class="tick b" style="--i:5"></span><span class="tick t" style="--i:6"></span><span class="tick b" style="--i:6"></span><span class="tick t" style="--i:7"></span><span class="tick b" style="--i:7"></span><span class="tick t" style="--i:8"></span><span class="tick b" style="--i:8"></span><span class="tick t" style="--i:9"></span><span class="tick b" style="--i:9"></span><span class="tick t" style="--i:10"></span><span class="tick b" style="--i:10"></span><span class="tick t" style="--i:11"></span><span class="tick b" style="--i:11"></span></div>
      <div class="hero-copy">
        <h1 class="display" id="hero-title" data-copy="headline"></h1>
        <div class="title-block">
          <p class="lede" data-copy="subhead"></p>
          <div class="title-block-find" id="find"></div>
        </div>
      </div>
      <div class="hero-art">
        <div class="hero-campus" id="hero-campus" aria-hidden="true"></div>
        <div class="hero-board iso-host" id="hero-board"></div>
      </div>
    </section>

    <!-- Story (v=story): the power path, scroll driven. Replaces the scales section. -->
    <section class="dem-story story" id="story" data-dem-only="story" aria-labelledby="story-title">
      <div class="dem-story-stage">
        <div class="story-grid">
          <div class="story-copy">
            <h2 class="dem-sr" id="story-title" data-copy="scales.heading"></h2>
            <div id="story-steps"></div>
          </div>
          <div class="story-art" aria-hidden="true">
            <div class="story-scene" id="story-scene"></div>
            <div class="story-board iso-host" id="story-board"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Scales: large and small loads, as two detail drawings. -->
    <section class="scales" id="scales" data-dem-hide="story" aria-labelledby="scales-title">
      <div class="section-head">
        <h2 class="section-title" id="scales-title" data-copy="scales.heading"></h2>
        <p class="section-intro" data-copy="scales.intro"></p>
      </div>
      <div class="scale-toggle-wrap" id="scale-toggle" data-dem-only="zoom"></div>
      <div class="details">
        <article class="detail detail-large" data-scale-block="large">
          <figure class="detail-figure">
            <div class="detail-art" id="detail-large" aria-hidden="true"></div>
            <figcaption class="detail-label" data-copy="scales.large.label"></figcaption>
          </figure>
          <h3 class="detail-title" data-copy="scales.large.title"></h3>
          <p class="detail-text" data-copy="scales.large.text"></p>
        </article>
        <article class="detail detail-small" data-scale-block="small">
          <figure class="detail-figure">
            <div class="detail-art" id="detail-small" aria-hidden="true"></div>
            <figcaption class="detail-label" data-copy="scales.small.label"></figcaption>
          </figure>
          <h3 class="detail-title" data-copy="scales.small.title"></h3>
          <p class="detail-text" data-copy="scales.small.text"></p>
        </article>
      </div>
      <p class="scales-note" data-copy="scales.note"></p>
    </section>

    <!-- Coverage: the working board, the covered-state index, the schedule of every map. -->
    <section class="coverage" id="coverage" aria-labelledby="coverage-title">
      <div class="section-head">
        <h2 class="section-title" id="coverage-title" data-copy="coverage.heading"></h2>
        <p class="section-intro" data-copy="coverage.intro"></p>
      </div>
      <div class="board-tools">
        <div class="board-legend" id="legend"></div>
        <div class="board-controls">
          <div id="filter" data-dem-only="micro"></div>
          <div id="scale-toggle-map" data-dem-only="zoom"></div>
        </div>
      </div>
      <div class="coverage-board iso-host" id="map"></div>
      <p class="as-of" data-copy="coverage.asOf"></p>

      <div class="index">
        <h3 class="sub-title" data-copy="coverage.listHeading"></h3>
        <div id="list"></div>
      </div>

      <div class="schedule">
        <h3 class="sub-title" data-copy="coverage.directoryHeading"></h3>
        <div class="schedule-head" aria-hidden="true">
          <span>Map</span><span>Tier</span><span>Grid levels</span><span>States</span><span>Utilities</span><span>Access</span>
        </div>
        <div id="directory"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p class="footer-mark"><span class="brand-mark" data-copy="wordmark"></span> <span class="brand-product" data-copy="product"></span></p>
    <p class="footer-meta"><span data-copy="footer.internal"></span> <span class="footer-year" data-copy="footer.year"></span></p>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
  <script src="../shared/us-states-albers.js"></script>
  <script src="../shared/apps.js"></script>
  <script src="../shared/copy.js"></script>
  <script src="../shared/core.js"></script>
  <script src="world.js"></script>
</body>
</html>
